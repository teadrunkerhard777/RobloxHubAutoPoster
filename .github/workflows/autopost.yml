name: Roblox Hub AutoPost

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autopost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run autoposter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python app.py

      - name: Save queue state
        run: |
          git config user.name "RobloxHub AutoPoster"
          git config user.email "actions@github.com"

          if git diff --quiet posts.json; then
            echo "posts.json не изменился"
          else
            git add posts.json
            git commit -m "Update published post status"
            git push
          fi
