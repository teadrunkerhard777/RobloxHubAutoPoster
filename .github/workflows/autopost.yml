name: Roblox Hub AutoPost

on:
  # Автоматическое расписание временно отключено на период смены
  # контента канала. Ручной запуск оставлен для контролируемой обкатки.
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: "Разрешить ручную публикацию подготовленных постов"
        required: true
        type: boolean
        default: false

# Не допускаем двух параллельных отправителей.
# Повторный запуск дождётся сохранения published-статуса
# и прочитает уже обновлённую очередь.
concurrency:
  group: roblox-hub-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autopost:
    # Старые внешние cron-вызовы без явного подтверждения ничего не публикуют.
    if: ${{ inputs.confirm_publication == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run autoposter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python app.py

      - name: Save queue state
        run: |
          git config user.name "RobloxHub AutoPoster"
          git config user.email "actions@github.com"

          if git diff --quiet posts.json; then
            echo "posts.json не изменился"
          else
            git add posts.json
            git commit -m "===Update published post status"
            git push
          fi
