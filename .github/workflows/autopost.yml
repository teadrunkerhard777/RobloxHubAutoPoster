name: Roblox Hub AutoPost

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions использует UTC. Эти часы соответствуют
    # текущей timezone проекта UTC+5 и всем существующим слотам:
    # 10:00, 12:00, 15:00, 17:00, 18:00 и 22:00.
    - cron: "0 5,7,10,12,13,17 * * *"

# Не допускаем двух параллельных отправителей.
# Повторный запуск дождётся сохранения published-статуса
# и прочитает уже обновлённую очередь.
concurrency:
  group: roblox-hub-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autopost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run autoposter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python app.py

      - name: Save queue state
        run: |
          git config user.name "RobloxHub AutoPoster"
          git config user.email "actions@github.com"

          if git diff --quiet posts.json; then
            echo "posts.json не изменился"
          else
            git add posts.json
            git commit -m "===Update published post status"
            git push
          fi
